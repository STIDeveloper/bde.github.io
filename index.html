<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QG du BDE Montreuil</title>
<meta name="description" content="Le QG de l'équipe du BDE de l'IUT de Montreuil : missions, dates et projets.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B7F76">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QG BDE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style id="qg-css">
/* Layout : une colonne pensée téléphone (max 720px), 3 tuiles "10 secondes" en tête, puis missions, dates, projets. Fiches en panneau qui monte du bas. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#101614; --muted:#5B6863; --line:#DCE4E0;
  --cyan:#3CCFD6; --mint:#5FD3B0; --lime:#B8F25A; --accent:#0B7F76; --accent-ink:#FFFFFF;
  --hot:#C2410C; --hot-bg:#FFEDE3; --warn:#9A6700; --warn-bg:#FFF4D6; --ok:#2F7D32; --ok-bg:#E5F5E3; --off:#6B7280; --off-bg:#EEF0F2;
  --glow:linear-gradient(120deg,#5CE1E6 0%,#66DDC0 45%,#C1FF72 100%);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201D; --ink:#EAF2EE; --muted:#9BAAA4; --line:#26322E;
  --accent:#5FD3B0; --accent-ink:#06201B;
  --hot:#FF8A5B; --hot-bg:#3A1E12; --warn:#F2C14E; --warn-bg:#33290F; --ok:#7BD37F; --ok-bg:#16301A; --off:#A3AAB3; --off-bg:#242A30;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201D; --ink:#EAF2EE; --muted:#9BAAA4; --line:#26322E;
  --accent:#5FD3B0; --accent-ink:#06201B;
  --hot:#FF8A5B; --hot-bg:#3A1E12; --warn:#F2C14E; --warn-bg:#33290F; --ok:#7BD37F; --ok-bg:#16301A; --off:#A3AAB3; --off-bg:#242A30;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Hero */
.hero{position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:22px max(16px,env(safe-area-inset-left,0px)) 18px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto -20%;height:260px;background:var(--glow);filter:blur(42px);opacity:.55;z-index:0}
.hero>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;border:2px solid var(--ink);padding:0 6px;border-radius:6px}
.hero h1{font-size:clamp(28px,7vw,40px);line-height:1.05;margin-top:14px;font-weight:800}
.hero p{margin:8px 0 0;color:var(--ink);max-width:52ch}
.stamp{display:inline-block;margin-top:10px;font-size:13px;color:var(--muted)}
.me{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.me input{flex:1 1 160px;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:14px}

/* 3 tuiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;text-align:left;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .n{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted);font-weight:500}
.tile.hot .n{color:var(--hot)}

/* Alerte */
.alert{margin-top:16px;background:var(--hot-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.alert h2{font-size:17px;color:var(--hot)}
.alert ul{margin:0;padding-left:18px}
.alert li{margin:2px 0}

/* Sections */
section{margin-top:30px;scroll-margin-top:12px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sh h2{font-size:24px;font-weight:800}
.sh p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Missions */
.missions{display:grid;gap:10px}
.mission{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.mission .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.mission h3{font-size:17px;font-weight:600;font-family:var(--f-body);line-height:1.3}
.mission .why{margin:0;color:var(--muted);font-size:14px}
.mission .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;background:var(--off-bg);color:var(--off)}
.tag.hot{background:var(--hot-bg);color:var(--hot)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.proj{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.who{font-size:13.5px;color:var(--muted)}
.who b{color:var(--ink)}

/* Dates */
.dates{list-style:none;margin:0;padding:0;display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dates li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.dates li:first-child{border-top:0}
.day{font-family:var(--f-display);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.day .d{font-size:24px;font-weight:800;display:block}
.day .m{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dates .t{font-weight:600}
.dates .s{font-size:13.5px;color:var(--muted)}
.dates li.maybe .day .d{color:var(--muted)}

/* Projets */
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.projects{grid-template-columns:1fr}}
.proj{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden;min-width:0}
.proj::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c,var(--mint))}
.proj .e{font-size:26px;line-height:1}
.proj h3{font-size:18px;font-weight:800}
.proj p{margin:0;font-size:14px;color:var(--muted)}
.proj .nx{font-size:13.5px;color:var(--ink)}
.group-title{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 8px;font-weight:700}

/* Comment ça marche */
.how{display:grid;gap:10px}
.how .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.how h3{font-size:17px;margin-bottom:4px}
.how p{margin:0;font-size:14.5px}

/* Résumé à partager */
.share{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px;display:grid;gap:10px;position:relative;overflow:hidden}
.share::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;background:var(--glow);filter:blur(30px);opacity:.6}
.share>*{position:relative;z-index:1}
.share h3{font-size:22px}
.share ol{margin:0;padding-left:20px;display:grid;gap:4px}
.share .foot{font-size:13px;opacity:.75}

/* Panneau */
.scrim{position:fixed;inset:0;background:rgba(5,10,8,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:8px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:760px){.sheet{left:50%;right:auto;width:680px;transform:translateX(-50%)}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet .x{position:sticky;top:0;float:right;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;width:36px;height:36px}
.sheet h2{font-size:26px;font-weight:800;margin-top:4px}
.q{margin-top:18px}
.q h4{margin:0 0 6px;font-family:var(--f-display);font-size:16px;font-weight:800}
.q p,.q li{font-size:15px}
.q p{margin:0}
.q ul{margin:0;padding-left:18px}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 10px 16px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--mint));border:2px solid var(--surface)}
.tl .dt{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.msg{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;font-size:14.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:50}
footer{margin-top:36px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}@media (min-width:760px){.sheet{animation:none}}}

/* Éléments grisés / annonce / aperçu */
.is-grise{opacity:.55;filter:grayscale(.7)}
.annonce{margin-top:16px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 14px;font-weight:600}
.preview-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:600}
.preview-bar a{color:inherit}

/* Admin */
.adm{padding-top:12px}
.adm-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:grid;gap:8px}
.adm-bar .l1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.adm-bar h1{font-size:20px;font-weight:800}
.adm-state{font-size:13.5px;color:var(--muted)}
.adm-state.dirty{color:var(--warn);font-weight:700}
.adm-state.err{color:var(--hot);font-weight:700}
.adm-actions{display:flex;gap:6px;flex-wrap:wrap}
.adm-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 0 4px}
.adm-sec{display:grid;gap:8px;margin-top:8px}
.adm-sec>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.adm-sec>.hd h2{font-size:20px}
.adm-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.adm-row.v-off{opacity:.5;border-style:dashed}
.adm-row.v-grise{opacity:.75}
.adm-row .t{font-weight:700;line-height:1.3}
.adm-row .m{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.adm-btns{display:flex;gap:5px;flex-wrap:wrap}
.ib{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:6px 9px;font-size:13.5px;line-height:1}
.ib.danger{color:var(--hot)}
.ib.armed{background:var(--hot);color:#fff;border-color:var(--hot)}
.ib:disabled{opacity:.35}
.vis{font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quick select,.quick input{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px;min-width:0}
.quick input{flex:1 1 120px}
.fld{display:grid;gap:4px;margin-top:12px}
.fld label{font-weight:700;font-size:14px}
.fld .hint{font-size:12.5px;color:var(--muted)}
.fld input[type=text],.fld input[type=date],.fld input[type=url],.fld select,.fld textarea{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.fld textarea{min-height:90px}
.fld input[type=color]{width:56px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.fld.check{display:flex;align-items:center;gap:8px}
.sugg{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.sugg.hot{border-left-color:var(--hot)}
.sugg.ok{border-left-color:var(--ok)}
.adm-help{font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.adm-help code{font-size:13px;word-break:break-all}

/* V3 : bloc priorités, détail des missions, prises en direct */
.focus{margin-top:16px;background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:16px;display:grid;gap:10px}
.focus h2{font-size:22px;font-weight:800}
.focus>p{margin:0;font-size:15px}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fcard{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 12px;overflow:hidden;background:var(--bg);min-width:0}
.fcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c,var(--mint))}
.fh{display:flex;align-items:center;gap:8px;font-size:18px;font-family:var(--f-display);font-weight:800}
.fh .e{font-size:26px;line-height:1}
.fh .tag{margin-left:auto;font-family:var(--f-body)}
.fcard .obj{margin:8px 0 0;font-weight:700;font-size:16px}
.fcard .who{margin:2px 0 0}
.focus .chips{margin-bottom:0}
.mt{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.mt:hover{text-decoration:underline}
.live-info{margin:0 0 10px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.live-dot.off{background:var(--off)}
.people{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.people li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}
.steps li{font-size:15px}
.blk{background:var(--hot-bg);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:6px}
.sheet input.msg{min-height:0}

/* ===== V4 : tutos, quiz, carrousels ===== */
.tt-big{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;margin:14px 0 2px;padding:13px 14px;font-size:16px;text-align:center}
.tt-cta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:14px 0 2px;padding:10px 12px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:15px}
.tt-lock{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--ink);font-size:15px}
.tt-lock b{color:var(--warn)}
.tt-bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 48px 12px 0}
.tt-bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:9px;transition:width .25s}
.tt-head{display:flex;align-items:center;gap:10px}
.tt-body{margin-top:10px;display:grid;gap:10px}
.tt-body p{margin:0;font-size:15.5px}
.tt-ul{margin:0;padding-left:20px;display:grid;gap:5px}
.tt-ul li{font-size:15.5px}
.tt-warn{border-left:5px solid var(--hot);background:var(--hot-bg);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600}
.tt-nav{margin-top:18px;position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.tt-nav .btn{flex:1 1 0}
.qz{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:12px}
.qz h4{margin:0 0 8px;font-family:var(--f-display);font-size:16px;font-weight:800}
.qz-c{display:grid;gap:8px}
.qz-b{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px}
.qz-b.no{background:var(--hot-bg);border-color:var(--hot);color:var(--hot);text-decoration:line-through}
.qz-b.yes{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.qz.done .qz-b:not(.yes){opacity:.5}
.qz-why{margin:8px 0 0;font-size:14px}
.qz-why.bad{color:var(--hot);font-weight:700}
.qz-win{margin-top:16px;padding:14px;border-radius:12px;background:var(--ok-bg)}
.qz-win h3{font-size:20px;color:var(--ok)}
.car{margin:4px 0 6px}
.car-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;margin-bottom:6px}
.car-n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;border-radius:12px;background:var(--bg);border:1px solid var(--line);scrollbar-width:none;overscroll-behavior-x:contain}
.car-track::-webkit-scrollbar{display:none}
.car-slide{flex:0 0 100%;scroll-snap-align:start;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.car-slide a{display:block;width:100%}
.car-slide img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;background:var(--bg)}
.car-slide figcaption{font-size:13.5px;color:var(--muted);padding:6px 10px 8px;text-align:center}
.car-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.car-nav .ib{width:40px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1}

/* ===================== V7 : fusion des modifications entre téléphones admin =====================

const COLS = ["missions","dates","projets","regles","sondages","defis"];

  const ca = a.config || {}, cb = b.config || {};
  Object.keys(cb).forEach(k => { if (!(k in ca) || J(ca[k]) !== J(cb[k])) d.config.set[k] = cb[k]; });
  Object.keys(ca).forEach(k => { if (!(k in cb)) d.config.unset.push(k); });
  COLS.forEach(k => {

function countConf(a, b){

/* Mise à jour du contenu livrée avec ce fichier : seulement les changements, rejoués sur la version en ligne */

function mergeNew(r){

/* ===================== TUTOS, QUIZ ET CARROUSELS =====================
   p.tuto  : texte. « # Titre » = nouvelle étape, « - » = puce, « ! » = encadré important, « @Nom » = carrousel d'images.
   p.quiz  : « ? question », « * bonne réponse », « - mauvaise réponse », « = explication ».
   p.galerie : [[nom du carrousel, chemin de l'image, légende], …]
   Si un projet a un quiz, il faut le réussir (une fois par téléphone) avant de pouvoir prendre une de ses missions. */
const TUTO_KEY = "qg-tutos";
let TUTOS = (() => { try { return JSON.parse(store.get(TUTO_KEY) || "{}") || {}; } catch(e){ return {}; } })();
let TUTO = null;
const hashStr = s => { let x = 5381; s = String(s || ""); for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); };
const safeImg = u => { u = String(u || "").trim(); return (/^https:\/\/[^\s"'<>]+$/i.test(u) || (/^[A-Za-z0-9_\-./]+\.(jpe?g|png|webp|gif)$/i.test(u) && u.indexOf("..") < 0 && u[0] !== "/")) ? u : ""; };
function galeries(p){
  const o = {};
  (p.galerie || []).forEach(g => { if (!Array.isArray(g) || !safeImg(g[1])) return; const k = String(g[0] || "Images").trim(); (o[k] = o[k] || []).push({src: safeImg(g[1]), cap: String(g[2] || "")}); });
  return o;
}
/* Tutos V7 : moins de texte, plus de visuel.
   « # 🛵 Titre » = étape (l'emoji devient l'icône) · « - 🍔 texte » = ligne avec icône · « 1. » = étape numérotée
   « > 2 €/mois | au lieu de 2,50 € » = chiffre clé · « $ CODE » = code à copier · « | texte » = texte prêt à copier
   « + » = astuce · « ! » = attention · « → Libellé | https://… » = bouton · « @Nom » = carrousel d'images */
const EMO = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|⃣|\p{Emoji_Modifier}|‍\p{Extended_Pictographic})*)\s*/u;
const splitEmo = s => { s = String(s || ""); const m = s.match(EMO); return m ? [m[1], s.slice(m[0].length)] : ["", s]; };
function parseTuto(txt){
  const steps = []; let cur = null;
  String(txt || "").split("\n").forEach(raw => {
    const l = raw.trim(); if (!l) return;
    if (l.startsWith("# ")){ const [e, t] = splitEmo(l.slice(2).trim()); cur = {t, e, b: []}; steps.push(cur); return; }
    if (!cur){ cur = {t: "", e: "", b: []}; steps.push(cur); }
    let m;
    if (l[0] === "|") cur.b.push(["copy", raw.replace(/^\s*\|\s?/, "").replace(/\s+$/, "")]);
    else if (l.startsWith("- ")) cur.b.push(["li", l.slice(2).trim()]);
    else if (l.startsWith("! ")) cur.b.push(["warn", l.slice(2).trim()]);
    else if (l.startsWith("+ ")) cur.b.push(["tip", l.slice(2).trim()]);
    else if (l.startsWith("> ")) cur.b.push(["key", l.slice(2).trim()]);
    else if (l.startsWith("$ ")) cur.b.push(["code", l.slice(2).trim()]);
    else if (/^(→|->)\s/.test(l)) cur.b.push(["btn", l.replace(/^(→|->)\s*/, "")]);
    else if ((m = l.match(/^\d{1,2}[.)]\s+(.*)$/))) cur.b.push(["num", m[1]]);
    else if (l.startsWith("@")) cur.b.push(["car", l.slice(1).trim()]);
    else cur.b.push(["p", l]);
  });
  return steps;
}
function parseQuiz(txt){
  const qs = []; let cur = null;
  String(txt || "").split("\n").forEach(raw => {
    const l = raw.trim(); if (!l) return;
    if (l[0] === "?"){ cur = {q: l.slice(1).trim(), c: [], ok: -1, why: ""}; qs.push(cur); return; }
    if (!cur) return;
    if (l[0] === "*"){ cur.ok = cur.c.length; cur.c.push(l.slice(1).trim()); }
    else if (l[0] === "-") cur.c.push(l.slice(1).trim());
    else if (l[0] === "=") cur.why = l.slice(1).trim();
  });
  return qs.filter(q => q.q && q.c.length >= 2 && q.ok >= 0);
}

const needQuiz = p => !!(p && p.id && parseQuiz(p.quiz).length);
const tutoOk = pid => { const p = DATA.projets.find(x => x.id === pid); if (!p || !vis(p) || !needQuiz(p)) return true; return TUTOS[pid] === hashStr(p.quiz); };

function tutoBody(s, gal){

function urgence(m, e){
  const st = e ? e.statut : m.statut;
  if (st === "faite") return ["ok","✅ Fait"];
  if (st === "faite-live") return ["ok","✅ Fini, à valider"];
  if (st === "bloquee") return ["hot","🚧 Bloquée"];
  if (m.visible === "grise") return ["","⏸ En pause"];
  const n = daysTo(m.fin);
  if (n < 0) return ["hot","En retard"];
  if (n === 0) return ["hot","Aujourd'hui"];
  if (n <= 3) return ["hot","Dans " + n + " j"];
  if (n <= 7) return ["warn","Avant le " + fmt(m.fin)];
  return ["", "Avant le " + fmt(m.fin)];
}

/* ---------- 📅 Agenda : fichier .ics + Google Agenda ---------- */
function hoursOf(s){
  const t = String(s || "").toLowerCase();
  let m = t.match(/(\d{1,2})\s*[h:]\s*(\d{2})?\s*(?:-|–|—|à|a|jusqu'à)\s*(\d{1,2})\s*(?:[h:]\s*(\d{2})?)?/);
  if (m && +m[1] < 24 && +m[3] < 24){ const a = [+m[1], +(m[2] || 0), +m[3], +(m[4] || 0)]; if (a[2] * 60 + a[3] > a[0] * 60 + a[1]) return a; return [a[0], a[1], Math.min(23, a[0] + 2), a[1]]; }
  m = t.match(/(?:^|[^\d])(\d{1,2})\s*h\s*(\d{2})?(?![\d])/);
  if (m && +m[1] < 24) return [+m[1], +(m[2] || 0), Math.min(23, +m[1] + 2), +(m[2] || 0)];
  return null;
}
const p2 = n => String(n).padStart(2, "0");
const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
/* lignes de 60 caractères max, sans jamais couper un emoji en deux */
const fold = l => { const cp = Array.from(l); if (cp.length <= 60) return l; const out = []; for (let i = 0; i < cp.length; i += 60) out.push((i ? " " : "") + cp.slice(i, i + 60).join("")); return out.join("\r\n"); };
function icsEvent(d){
  const day = String(d.d).replace(/-/g, ""), h = hoursOf(d.s), p = proj(d.p);
  const now = new Date(), stamp = now.getUTCFullYear() + p2(now.getUTCMonth()+1) + p2(now.getUTCDate()) + "T" + p2(now.getUTCHours()) + p2(now.getUTCMinutes()) + "00Z";
  const L = ["BEGIN:VEVENT", "UID:" + d.id + "-" + day + "@qg-bde-montreuil", "DTSTAMP:" + stamp];
  if (h){ L.push("DTSTART:" + day + "T" + p2(h[0]) + p2(h[1]) + "00", "DTEND:" + day + "T" + p2(h[2]) + p2(h[3]) + "00"); }
  else { L.push("DTSTART;VALUE=DATE:" + day, "DTEND;VALUE=DATE:" + addDays(d.d, 1).replace(/-/g, "")); }
  L.push("SUMMARY:" + icsEsc((d.certain ? "" : "(à confirmer) ") + (p.e ? p.e + " " : "") + d.t + " · BDE"),
    "DESCRIPTION:" + icsEsc((d.s ? d.s + "\n" : "") + (d.certain ? "" : "Date encore à confirmer.\n") + "QG du BDE : " + siteUrl()));
  const al = h ? ["-P1D", "-PT1H"] : ["-PT15H"];
  al.forEach(tr => L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(d.t), "TRIGGER:" + tr, "END:VALARM"));
  L.push("END:VEVENT");
  return L;
}
function icsHref(list){
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//BDE IUT Montreuil//QG//FR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:BDE Montreuil"];
  list.forEach(d => icsEvent(d).forEach(l => L.push(l)));
  L.push("END:VCALENDAR");
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(L.map(fold).join("\r\n") + "\r\n");
}
function gcalUrl(d){
  const day = String(d.d).replace(/-/g, ""), h = hoursOf(d.s), p = proj(d.p);
  const dates = h ? day + "T" + p2(h[0]) + p2(h[1]) + "00/" + day + "T" + p2(h[2]) + p2(h[3]) + "00" : day + "/" + addDays(d.d, 1).replace(/-/g, "");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent((p.e ? p.e + " " : "") + d.t + " · BDE") + "&dates=" + dates +
    "&details=" + encodeURIComponent((d.s ? d.s + "\n" : "") + "QG du BDE : " + siteUrl()) + "&ctz=Europe/Paris";
}
const slug = s => nrm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "evenement";
function sheetDate(id){
  const d = DATA.dates.find(x => x.id === id); if (!d) return;

const pollOpts = s => (s.opts || []).map(o => String(o).trim()).filter(Boolean).slice(0, 12);
function pollHTML(s){
  const opts = pollOpts(s), votes = VOTES.filter(v => v.sid === s.id), mine = myVote(s.id);
  const sel = POLL_SEL[s.id] || (mine ? mine.slice() : []);

  const cnt = o => votes.filter(v => v.choix.includes(o));

    '<div class="po-l">' + opts.map((o, i) => { const who = cnt(o).map(v => v.prenom), on = sel.includes(o);
      return '<button type="button" class="po' + (on ? ' on' : '') + '" data-po="' + esc(s.id) + '" data-oi="' + i + '"' + (can ? '' : ' disabled') + ' aria-pressed="' + on + '">' +

function rePoll(sid){
  const s = (DATA.sondages || []).find(x => x.id === sid); if (!s) return;

async function sendVote(sid, choix){
  const inp = document.querySelector('[data-pn="' + CSS.escape(sid) + '"]');
  const n = (me || (inp ? inp.value : "")).trim();
  if (choix.length && !n){ toast("Écris ton prénom 🙂"); if (inp) inp.focus(); return; }
  if (n && n !== me){ me = n; store.set("bde-me", n); }
  document.querySelectorAll('[data-pv="' + CSS.escape(sid) + '"],[data-pv-del="' + CSS.escape(sid) + '"]').forEach(b => { b.disabled = true; });
  try {
    const res = await apiPost({a:"vote", cid: CID, sid, prenom: n, choix});

/* ---------- 🏅 Merci à l'équipe ---------- */
function teamStats(){
  const T = {}, key = n => n.trim().toLowerCase();
  const add = (n, f, titre, date) => { n = String(n || "").trim(); if (!n) return; const k = key(n); const t = T[k] || (T[k] = {nom: n, faites: [], encours: []}); t[f].push({titre, date}); };
  DATA.missions.forEach(m => { const names = staticNames(m);
    if (m.statut === "faite") names.forEach(n => add(n, "faites", m.titre, m.faiteLe || ""));
    else if (m.statut === "prise" || m.statut === "bloquee") names.forEach(n => add(n, "encours", m.titre, "")); });
  (DATA.bilan || []).forEach(b => String(b.qui || "").split(/\s*,\s*/).forEach(n => add(n, "faites", b.titre, b.faiteLe || "")));
  Object.values(LIVE).forEach(d => Object.entries(d.items || {}).forEach(([mid, it]) => {
    const m = DATA.missions.find(x => x.id === mid), n = String(d.prenom || "").trim(); if (!m || !n || m.statut === "faite") return;
    if (staticNames(m).some(x => key(x) === key(n))) return;
    if (it.etat === "faite") add(n, "faites", m.titre + " (à valider)", String(it.at || "").slice(0,10));
    else add(n, "encours", m.titre, "");
  }));
  return Object.values(T).sort((a,b) => b.faites.length - a.faites.length || b.encours.length - a.encours.length || a.nom.localeCompare(b.nom));
}
function merciHTML(){
  const t = teamStats().filter(x => x.faites.length || x.encours.length);
  return '<div class="sh" style="margin-top:22px"><h2>🏅 Merci à l\'équipe</h2><p>Celles et ceux qui ont fait avancer le BDE.</p></div>' +
    (t.length ? '<ul class="people merci">' + t.map(x => '<li><b>' + esc(x.nom) + '</b>' + (x.faites.length ? '<span class="tag ok">✅ ' + x.faites.length + ' faite' + (x.faites.length > 1 ? 's' : '') + '</span>' : '') + (x.encours.length ? '<span class="tag">👤 ' + x.encours.length + ' en cours</span>' : '') + '</li>').join("") + '</ul>'

}

}

function suggestions(){
  const s = [];
  DATA.missions.forEach(m => {
    if (!vis(m)) return;
    if (m.statut !== "faite" && m.fin && daysTo(m.fin) < 0) s.push({lvl:"hot", txt:"Mission en retard : « "+m.titre+" » (prévue le "+fmt(m.fin)+")", fix:[["done","✅ Marquer faite"],["push7","📅 Repousser de 7 jours"],["hide","🚫 Masquer"]], kind:"missions", id:m.id});
    else if (m.statut === "faite") s.push({lvl:"ok", txt:"Mission faite encore visible : « "+m.titre+" »", fix:[["hide","🚫 Masquer"]], kind:"missions", id:m.id});
    if (m.statut === "prise" && !String(m.qui||"").trim()) s.push({lvl:"", txt:"Mission « prise » sans prénom : « "+m.titre+" »", fix:[["edit","✏️ Compléter"]], kind:"missions", id:m.id});
    if (m.statut === "bloquee") s.push({lvl:"hot", txt:"Mission bloquée : « "+m.titre+" »"+(m.qui ? " ("+m.qui+")" : "")+". Quelqu'un peut reprendre ?", fix:[["free","🟢 Remettre à prendre"],["edit","✏️ Modifier"]], kind:"missions", id:m.id});
    if (m.projet && !DATA.projets.some(p => p.id === m.projet) && m.projet !== "reunion") s.push({lvl:"", txt:"Mission liée à un projet supprimé : « "+m.titre+" »", fix:[["edit","✏️ Choisir un projet"]], kind:"missions", id:m.id});
  });
  DATA.dates.forEach(d => { if (vis(d) && daysTo(d.d) < -1) s.push({lvl:"ok", txt:"Date passée : « "+d.t+" » ("+fmt(d.d)+")", fix:[["hide","🚫 Masquer"],["delete","🗑 Supprimer"]], kind:"dates", id:d.id}); });
  DATA.projets.forEach(p => {
    if (!vis(p) || p.visible === "grise") return;
    const act = DATA.missions.filter(m => m.projet === p.id && vis(m) && m.statut !== "faite").length;
    if (p.groupe === "en-cours" && !act) s.push({lvl:"", txt:"Projet en cours sans mission : « "+p.nom+" ». Ajoute une action concrète pour que l'équipe puisse aider.", fix:[["addm","➕ Ajouter une mission"]], kind:"projets", id:p.id});
    if ((p.groupe === "en-cours" || p.groupe === "a-lancer") && (!p.next || !p.maintenant)) s.push({lvl:"", txt:"Projet « "+p.nom+" » : il manque « Prochaine étape » ou « Ça en est où ? »", fix:[["edit","✏️ Compléter"]], kind:"projets", id:p.id});
  });
  const lr = liveRows().length;
  if (lr) s.push({lvl:"", txt: lr + " prise(s) de mission en direct pas encore reportée(s) sur la page.", fix:[["direct","📥 Voir"]], kind:"config", id:""});
  if (!DATA.projets.some(p => safeUrl(p.wa)) && !safeUrl(DATA.config.waGeneral)) s.push({lvl:"", txt:"Aucun lien de groupe WhatsApp : après « Je prends », les membres doivent choisir le groupe eux-mêmes.", fix:[["cfg","🛠️ Ajouter le lien général"]], kind:"config", id:""});
  if (!DATA.config.driveUrl) s.push({lvl:"", txt:"Pas de lien Drive : le bouton « Ajouter un doc » renvoie vers WhatsApp.", fix:[["cfg","🛠️ Ajouter le lien"]], kind:"config", id:""});
  return s;
}
function liveRows(){
  const rows = [];
  Object.keys(LIVE).forEach(uid => { const d = LIVE[uid] || {}; Object.keys(d.items || {}).forEach(mid => { const it = d.items[mid]; if (!it || !ETATS[it.etat]) return;
    const m = DATA.missions.find(x => x.id === mid);
    const prenom = String(d.prenom || "").slice(0,40) || "Quelqu'un";
    const want = {prise:"prise", aide:"prise", bloque:"bloquee", faite:"faite"}[it.etat];
    const reported = !!(m && staticNames(m).some(n => n.toLowerCase() === prenom.toLowerCase()) && (m.statut === want || (want === "prise" && m.statut !== "libre")));
    rows.push({uid, mid, m, prenom, etat: it.etat, note: String(it.note || "").slice(0,300), at: String(it.at || ""), reported}); }); });
  return rows.filter(r => !r.reported).sort((a,b) => b.at.localeCompare(a.at));
}

function fieldHTML(kind, x, [key, type, label, hint]){

  const h = hint ? '<span class="hint">'+esc(hint)+'</span>' : "";
  const opt = (pairs, cur) => pairs.map(([k,l]) => '<option value="'+esc(k)+'"'+(String(cur)===String(k)?" selected":"")+'>'+esc(l)+'</option>').join("");
  if (type === "textarea") return '<div class="fld"><label for="'+id+'">'+label+'</label>'+h+'<textarea id="'+id+'" data-f="'+key+'"'+(key === "tuto" || key === "quiz" ? ' style="min-height:280px;font-size:14px"' : '')+'>'+esc(v)+'</textarea></div>';
  if (type === "galerie") return '<div class="fld"><label for="'+id+'">'+label+'</label>'+h+'<textarea id="'+id+'" data-f="'+key+'" data-t="galerie" style="min-height:160px;font-size:13px">'+esc((v||[]).map(g => (g[0]||"")+" | "+(g[1]||"")+" | "+(g[2]||"")).join("\n"))+'</textarea></div>';
  if (type === "lines") return '<div class="fld"><label for="'+id+'">'+label+'</label>'+h+'<textarea id="'+id+'" data-f="'+key+'" data-t="lines">'+esc((v||[]).join("\n"))+'</textarea></div>';
  if (type === "histoire") return '<div class="fld"><label for="'+id+'">'+label+'</label>'+h+'<textarea id="'+id+'" data-f="'+key+'" data-t="histoire" style="min-height:140px">'+esc((v||[]).map(([a,b]) => a+" | "+b).join("\n"))+'</textarea></div>';
  if (type === "liens") return '<div class="fld"><label for="'+id+'">'+label+'</label>'+h+'<textarea id="'+id+'" data-f="'+key+'" data-t="liens">'+esc((v||[]).map(([a,b]) => a+" | "+b).join("\n"))+'</textarea></div>';
  if (type === "check") return '<div class="fld check"><input type="checkbox" id="'+id+'" data-f="'+key+'" data-t="check"'+(v?" checked":"")+'><label for="'+id+'">'+label+'</label></div>';
  if (type === "color") return '<div class="fld"><label for="'+id+'">'+label+'</label><input type="color" id="'+id+'" data-f="'+key+'" value="'+esc(v||"#5FD3B0")+'"></div>';
  if (type === "date") return '<div class="fld"><label for="'+id+'">'+label+'</label>'+h+'<input type="date" id="'+id+'" data-f="'+key+'" value="'+esc(v)+'"></div>';
  let pairs = null;
  if (type === "sel-projet") pairs = [["","— Aucun —"],["reunion","🗣️ Réunion"]].concat(DATA.projets.map(p => [p.id, (p.e||"")+" "+p.nom]));
  if (type === "sel-type") pairs = Object.entries(TYPES);
  if (type === "sel-statut") pairs = Object.entries(STATUTS);
  if (type === "sel-groupe") pairs = GROUPES;
  if (type === "sel-vis") pairs = Object.entries({on:"👁 Visible", grise:"⏸ Grisé (visible, en pause)", off:"🚫 Masqué (caché pour l'équipe)"});
  if (pairs) return '<div class="fld"><label for="'+id+'">'+label+'</label>'+h+'<select id="'+id+'" data-f="'+key+'">'+opt(pairs, v ?? (type==="sel-vis"?"on":""))+'</select></div>';

let editing = null; /* {kind, id, isNew, obj} */
function openEditor(kind, id, preset){
  const isNew = !id;
  const obj = isNew ? Object.assign(NEW[kind](), preset || {}) : JSON.parse(JSON.stringify(find(kind, id)));
  editing = {kind, id: obj.id, isNew, obj};
  const name = {missions:"la mission", dates:"la date", projets:"le projet", regles:"la règle", sondages:"le sondage", defis:"le défi"}[kind];
  openSheet('<h2 id="sheetTitle">'+(isNew ? "➕ Ajouter " : "✏️ Modifier ")+name+'</h2>'+
    '<form id="edForm">'+FIELDS[kind].map(f => fieldHTML(kind, obj, f)).join("")+
    '<div class="actions" style="margin-top:16px"><button class="btn" type="submit">✅ Valider</button><button class="btn ghost" type="button" data-act="close">Annuler</button>'+(isNew || !IMP_LAB[kind] ? '' : '<button class="btn ghost small" type="button" data-adm="blk" data-kind="'+kind+'" data-id="'+esc(obj.id)+'">📋 Copier en bloc texte</button>')+'</div>'+
    '<p class="note">Valider garde la modification dans ton brouillon. Elle n\'est visible par l\'équipe qu\'après « 🚀 Publier ».</p></form>');
  $("#edForm").addEventListener("submit", e => {
    e.preventDefault();
    const o = editing.obj;
    $("#edForm").querySelectorAll("[data-f]").forEach(inp => {
      const k = inp.dataset.f, t = inp.dataset.t;
      if (t === "check") o[k] = inp.checked;
      else if (t === "lines") o[k] = inp.value.split("\n").map(s => s.trim()).filter(Boolean);
      else if (t === "liens") o[k] = inp.value.split("\n").map(x => x.trim()).filter(Boolean).map(x => { const i = x.lastIndexOf("|"); return i < 0 ? ["Ouvrir le lien", x] : [x.slice(0,i).trim(), x.slice(i+1).trim()]; });
      else if (t === "galerie") o[k] = inp.value.split("\n").map(x => x.trim()).filter(Boolean).map(x => { const s = x.split("|").map(y => y.trim()); return [s[0] || "Images", s[1] || "", s.slice(2).join(" | ")]; }).filter(g => g[1]);
      else if (t === "histoire") o[k] = inp.value.split("\n").map(s => s.trim()).filter(Boolean).map(s => { const i = s.indexOf("|"); return i < 0 ? ["", s] : [s.slice(0,i).trim(), s.slice(i+1).trim()]; });
      else o[k] = inp.value.trim();
    });
    if (editing.kind === "missions" && o.statut === "libre") o.qui = o.qui || "";
    if (editing.kind === "missions" && o.statut === "faite" && !o.faiteLe) o.faiteLe = isoToday();
    if (editing.isNew) DATA[editing.kind].push(o);
    else { const arr = DATA[editing.kind]; const i = arr.findIndex(x => x.id === editing.id); if (i >= 0) arr[i] = o; }
    editing = null; closeSheet(); lastMsg = ""; changed(); toast("Enregistré dans le brouillon ✏️");
  });
}

function act(kind, id, a){
  const arr = DATA[kind]; const i = arr.findIndex(x => x.id === id); if (i < 0) return;
  const x = arr[i];
  if (a === "vis") x.visible = VIS_NEXT[x.visible || "on"];
  if (a === "up" && i > 0) [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
  if (a === "down" && i < arr.length-1) [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
  if (a === "dup"){ const c = JSON.parse(JSON.stringify(x)); c.id = newId(kind[0]); if (kind === "missions"){ c.cree = isoToday(); c.statut = "libre"; c.qui = ""; delete c.faiteLe; } if (c.titre) c.titre += " (copie)"; if (c.nom) c.nom += " (copie)"; if (c.t) c.t += " (copie)"; arr.splice(i+1, 0, c); }
  if (a === "del"){ if (kind === "missions" && x.statut === "faite" && String(x.qui || "").trim()) DATA.bilan.push({titre: x.titre, projet: x.projet, qui: x.qui, faiteLe: x.faiteLe || ""}); arr.splice(i, 1); }
  lastMsg = ""; changed();
}

function applyFix(s, a){
  if (a === "cfg"){ tab = "reglages"; renderAdmin(); return; }

function weekText(){
  const t0 = isoToday(), start = addDays(t0, -7), end = addDays(t0, 7);
  const pn = id => { const p = proj(id); return p.nom ? " (" + (p.e ? p.e + " " : "") + p.nom + ")" : ""; };
  const vis2 = m => vis(m) && m.visible !== "grise";
  const nouv = DATA.missions.filter(m => vis2(m) && m.statut !== "faite" && m.cree && m.cree >= start);
  const dates = D().filter(d => d.d >= t0 && d.d <= end).sort((a,b) => a.d.localeCompare(b.d));
  const libres = DATA.missions.filter(m => vis2(m) && eff(m).statut === "libre").sort((a,b) => String(a.fin).localeCompare(String(b.fin))).slice(0, 6);
  const merci = [];
  DATA.missions.forEach(m => { if (vis(m) && m.statut === "faite" && m.faiteLe && m.faiteLe >= start) staticNames(m).forEach(n => merci.push("• " + n + " a fini « " + m.titre + " » ✅")); });
  Object.values(LIVE).forEach(d => Object.entries(d.items || {}).forEach(([mid, it]) => {
    const m = DATA.missions.find(x => x.id === mid), n = String(d.prenom || "").trim(); if (!m || !n || !vis(m) || String(it.at || "").slice(0,10) < start || (m.statut === "faite" && it.etat !== "faite")) return;
    const line = it.etat === "faite" ? "• " + n + " a fini « " + m.titre + " » ✅" : (it.etat === "prise" || it.etat === "aide") ? "• " + n + " s'occupe de « " + m.titre + " »" : "";
    if (line && !merci.includes(line)) merci.push(line);
  }));
  const polls = activePolls();
  const L = ["📍 *BDE Montreuil : la semaine*", "_du " + fmt(t0) + " au " + fmt(end) + "_"];
  if (nouv.length) L.push("", "🆕 *Nouvelles missions*", ...nouv.map(m => "• " + m.titre + pn(m.projet) + " · avant le " + fmt(m.fin)));
  if (dates.length) L.push("", "📅 *Cette semaine*", ...dates.map(d => "• " + JOUR_C[parse(d.d).getDay()] + " " + fmt(d.d) + " : " + d.t + (d.s ? " (" + d.s + ")" : "") + (d.certain ? "" : " _à confirmer_")));

  defisActifs().forEach(f => { const rs = defiRows(f.id), tot = rs.reduce((a, r) => a + r.score, 0);
    L.push("", "🏆 *" + f.titre + "* : " + tot + " / " + (num(f.objectif, 5) * num(f.places, 10)) + " " + (f.unite || "inscriptions") + ", " + rs.length + " participant" + (rs.length > 1 ? "s" : ""), ...rs.slice(0, 3).map((r, i) => ["🥇","🥈","🥉"][i] + " " + r.prenom + " : " + r.score), "👉 Rejoins le défi sur l'accueil du QG"); });
  if (merci.length) L.push("", "👏 *Merci !*", ...merci.slice(0, 12));

async function publier(){
  if (busy || !dirty()) return;
  if (!API){ lastMsg = "⛔ Le site n'est pas encore relié au Google Sheet : suis le bloc 🔌 en haut."; renderAdmin(); return; }
  if (!adminKey()){ lastMsg = "🔑 Entre d'abord ton mot de passe admin (en haut)."; renderAdmin(); return; }
  busy = true; lastMsg = "⏳ Publication en cours…"; renderAdmin();
  store.set("qg-draft", JSON.stringify({base: DBASE || SAVED, data: DATA, at: Date.now()}));
  let merged = false, conf = 0;
  try {
    for (let essai = 0; essai < 2; essai++){
      /* 1. on relit la toute dernière version en ligne */
      const fresh = await apiGet();
      if (!fresh || !fresh.ok) throw new Error("get");
      setPrises(fresh.prises); setVotes(fresh); setDefis(fresh.defis);
      const theirs = fresh.data && Array.isArray(fresh.data.missions) ? normalize(fresh.data) : null;
      const baseStr = DBASE || SAVED;
      let out = normalize(JSON.parse(JSON.stringify(DATA)));
      /* 2. si quelqu'un a publié entre-temps : on rejoue seulement NOS changements par-dessus */
      if (theirs && JSON.stringify(theirs) !== baseStr){
        const base = normalize(JSON.parse(baseStr));
        const mine = diffData(base, DATA);
        conf = countConf(diffData(base, theirs), mine);
        out = applyDiff(theirs, mine); merged = true;
      }
      out.config.majLe = isoToday();
      const res = await apiPost({a:"save", key: adminKey(), data: out, base: String(fresh.version || "")});
      if (res && res.ok){
        VERSION = String(res.version); REMOTE_EMPTY = false;
        DATA = out; SAVED = JSON.stringify(out); BASE = SAVED; DBASE = null; store.del("qg-draft");
        lastMsg = "✅ Publié !" + (merged ? " 🔀 Les changements publiés depuis un autre téléphone ont été gardés" + (conf ? " (" + conf + " champ" + (conf > 1 ? "s" : "") + " modifié" + (conf > 1 ? "s" : "") + " des deux côtés : c'est ta version qui compte)" : "") + "." : "") + " Tout le monde voit la nouvelle version.";
        busy = false; renderAdmin(); return;
      }
      const code = res && res.code;
      if (code === "conflict" && essai === 0) continue;   /* quelqu'un a publié pile en même temps : on recommence une fois */
      if (code === "bad_key"){ store.del("qg-key"); lastMsg = "⛔ Mot de passe refusé. Entre-le à nouveau en haut."; }
      else if (code === "busy") lastMsg = "⏳ Le serveur est occupé : réessaie dans quelques secondes.";
      else if (code === "conflict") lastMsg = "↻ Quelqu'un publie en même temps que toi : réessaie dans quelques secondes. Ton brouillon est gardé.";
      else lastMsg = "⛔ La publication n'a pas marché (" + (code || "erreur") + "). Ton brouillon est gardé.";
      break;
    }
  } catch(e){
    lastMsg = "⛔ Pas de réponse du serveur Google. Vérifie ta connexion et réessaie : ton brouillon est gardé.";
  }
  busy = false; renderAdmin();
}

  if (a === "blk"){ const x = find(kind, id); if (x) copy(impToBlock(kind, x), "Bloc copié ✅ Colle-le dans 📋 Coller un bloc"); return; }
  if (a === "wk-copy") return copy(weekTxt || weekText(), "Message copié ✅ Colle-le dans WhatsApp");
  if (a === "wk-reset"){ weekTxt = weekText(); renderAdmin(); return; }
  if (a === "eq-rapport") return copy(eqRapport(), "Copié ✅ Colle-le dans ton rapport");
  if (a === "eq-merci") return copy(eqMerci());
  if (a === "hist-reload"){ HIST = null; histMsg = ""; loadHist(); return; }
  if (a === "hist-load" || a === "poll-reset" || a === "defi-reset"){ const k2 = a + ":" + (b.dataset.v || id);
    if (armed !== k2){ armed = k2; b.textContent = a === "hist-load" ? "Sûr ? ↩️ Charger" : "Sûr ? 🧹"; b.classList.add("armed"); setTimeout(() => { if (armed === k2){ armed = null; renderAdmin(); } }, 3500); return; }
    armed = null; if (a === "hist-load") histLoad(b.dataset.v); else if (a === "defi-reset") defiReset(id); else pollReset(id); return; }
  if (a === "add") return openEditor(kind);
  if (a === "edit") return openEditor(kind, id);
  if (a === "del"){
    const key = "del:" + id;
    if (armed !== key){ armed = key; b.textContent = "Sûr ? 🗑"; b.classList.add("armed"); setTimeout(() => { if (armed === key){ armed = null; renderAdmin(); } }, 3500); return; }
    armed = null; return act(kind, id, "del");
  }
  if (["vis","up","down","dup"].includes(a)) return act(kind, id, a);
  if (a === "rep"){ const r = liveRows()[+b.dataset.k]; if (!r || !r.m) return;
    const names = staticNames(r.m); if (!names.some(n => n.toLowerCase() === r.prenom.toLowerCase())) names.push(r.prenom);
    r.m.qui = names.join(", "); r.m.statut = {prise:"prise", aide:"prise", bloque:"bloquee", faite:"faite"}[r.etat]; if (r.m.statut === "faite" && !r.m.faiteLe) r.m.faiteLe = isoToday();
    lastMsg = "✅ " + r.prenom + " est sur la mission. Pense à 🚀 Publier."; changed(); return; }
  if (a === "liveDel"){ const r = liveRows()[+b.dataset.k]; if (!r) return; const key = "ld:" + r.uid + r.mid;
    if (armed !== key){ armed = key; b.textContent = "Sûr ? 🗑"; b.classList.add("armed"); setTimeout(() => { if (armed === key){ armed = null; renderAdmin(); } }, 3500); return; }
    armed = null; liveDelete(r).then(ok => { lastMsg = ok ? "🗑 Prise effacée." : "⛔ Impossible d'effacer : vérifie ta connexion et ton mot de passe admin."; renderAdmin(); }); return; }
  if (a === "copylink") return copy(location.href.split("#")[0] + ADMIN_HASH, "Lien admin copié ✅");
  if (a === "copyjson") return copy(JSON.stringify(DATA, null, 1), "Données copiées ✅ (sauvegarde)");
  if (a === "bulk-faites"){ DATA.missions.forEach(m => { if (m.statut === "faite") m.visible = "off"; }); lastMsg = ""; changed(); return; }
  if (a === "bulk-dates"){ DATA.dates.forEach(d => { if (daysTo(d.d) < -1) d.visible = "off"; }); lastMsg = ""; changed(); return; }
});
document.addEventListener("change", e => {
  const q = e.target.closest("[data-q]");
  if (q){ const x = find(q.dataset.kind, q.dataset.id); if (!x) return; x[q.dataset.q] = q.value.trim();
    if (q.dataset.q === "qui" && x.qui && x.statut === "libre") x.statut = "prise";
    if (q.dataset.q === "statut" && x.statut === "libre") x.qui = "";
    if (q.dataset.q === "statut" && x.statut === "faite" && !x.faiteLe) x.faiteLe = isoToday();
    lastMsg = ""; changed(); return; }
  const wa = e.target.closest("[data-wa]");
  if (wa){ const p = DATA.projets.find(x => x.id === wa.dataset.wa); if (!p) return; p.wa = wa.value.trim();
    if (p.wa && !/^https:\/\/chat\.whatsapp\.com\//.test(p.wa)) toast("⚠️ Ce lien ne ressemble pas à une invitation WhatsApp");
    lastMsg = ""; changed(); return; }
  const cf = e.target.closest("[data-cf]");
  if (cf){ DATA.config[cf.dataset.cf] = cf.value.trim(); lastMsg = ""; changed(); }
});

/* ===================== ROUTAGE ===================== */
function isAdmin(){ return location.hash === ADMIN_HASH; }
let wasAdmin = false;
function route(){
  closeSheet();
  if (isAdmin()){
    wasAdmin = true;
    $("#public").hidden = true; $("#admin").hidden = false; $("#tabbar").hidden = true; document.body.classList.remove("has-nav");
    const raw = store.get("qg-draft");
    if (raw && !dirty()){
      try { const dr = JSON.parse(raw);
        if (JSON.stringify(dr.data) !== SAVED && JSON.stringify(dr.data) !== BASE){
          const db = dr.base || SAVED;
          if (db === SAVED){ DATA = normalize(dr.data); DBASE = db; lastMsg = "📝 Ton brouillon non publié a été repris."; }
          else { DATA = applyDiff(JSON.parse(SAVED), diffData(normalize(JSON.parse(db)), normalize(dr.data))); DBASE = SAVED;
            lastMsg = "📝 Ton brouillon a été repris et remis à jour avec la version publiée depuis un autre téléphone : seuls tes changements seront ajoutés par-dessus."; }
        }
      } catch(e){ store.del("qg-draft"); }
    }
    renderAdmin(); window.scrollTo(0,0);
  } else {
    $("#admin").hidden = true; $("#public").hidden = false; $("#tabbar").hidden = false; document.body.classList.add("has-nav");
    $("#previewBar").hidden = !(wasAdmin && dirty());
    renderPublic();
    const h = location.hash; setPane(PANES.includes(h.slice(1)) ? h.slice(1) : pane, false); if (h.startsWith("#p-")) sheetProjet(h.slice(3)); else if (h.startsWith("#t-")) sheetTuto(h.slice(3), 0, null);
  }
}

/* Clics site public */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-f]"); if (!b || b.closest("#edForm")) { if (b && b.dataset.act === "close") closeSheet(); return; }
  if (b.closest("#admin")) return;
  if (b.dataset.f !== undefined && !b.dataset.act){ filtre = b.dataset.f; renderChips(); renderMissions(); return; }
  const a = b.dataset.act, id = b.dataset.id;
  if (a === "close") closeSheet();
  else if (a === "projet"){ sheetProjet(id); history.replaceState(null,"","#p-"+id); }
  else if (a === "go-missions"){ closeSheet(); setPane("missions", true); }
  else if (a === "fmis"){ closeSheet(); filtre = "p:" + id; renderChips(); renderMissions(); setPane("missions", true); }
  else if (a === "date") sheetDate(id);
  else if (a === "defi") sheetDefi(id);
  else if (a === "mission") sheetMission(id);
  else if (a === "tuto") sheetTuto(id, 0, b.dataset.then || null);
  else if (a === "retire"){ const m = DATA.missions.find(x => x.id === id); if (!m) return;
    saveLive(id, "retire", "", me).then(ok => { if (!ok) saveLocal(id, "retire"); renderPublic(); sheetMission(id); toast("C'est noté, tu n'es plus sur cette mission."); }); }
  else { const m = DATA.missions.find(x => x.id === id);
    if (m && a === "prendre" && !myEntry(m.id) && !tutoOk(m.projet)) { sheetTuto(m.projet, 0, m.id); return; }
    if (m && ["prendre","bloque","faite","doc"].includes(a)) sheetMessage(a, m); }
});
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
$("#me").addEventListener("change", e => { me = e.target.value.trim(); store.set("bde-me", me); meEdit = false; renderPublic(); });
$("#meBox").addEventListener("submit", e => { e.preventDefault(); me = $("#me").value.trim(); store.set("bde-me", me); meEdit = false; renderPublic(); });
$("#copyRecap").addEventListener("click", () => copy(recapText()));
$("#backAdmin").addEventListener("click", e => { e.preventDefault(); location.hash = ADMIN_HASH.slice(1); });
window.addEventListener("hashchange", () => { if (isAdmin() || !$("#admin").hidden || location.hash === "#apercu" || location.hash === "") route(); else if (PANES.includes(location.hash.slice(1))){ closeSheet(); setPane(location.hash.slice(1), false); } });
window.addEventListener("beforeunload", e => { if (wasAdmin && dirty() && !busy){ e.preventDefault(); e.returnValue = ""; } });

(async () => {
  if (API && isAdmin()){
    $("#public").hidden = true; $("#admin").hidden = false;
    $("#admin").innerHTML = '<p class="who" style="padding:24px 0">⏳ Chargement de la version en ligne…</p>';
    await loadRemote();
  }
  route();
  if (API && !isAdmin()){
    liveState = "loading"; renderLiveInfo();
    await loadRemote();
    rerenderLive();
  }
  initLive();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
</script>
